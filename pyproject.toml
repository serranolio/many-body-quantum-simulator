[project]
name = "many-body-quantum-simulator"
version = "0.1.0"
description = "Fock-basis simulator for two-mode bosonic systems: Chebyshev real- and imaginary-time evolution with sparse O(N) Hamiltonians and Numba."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Federico Serrano", email = "serranolio@gmail.com"}]
requires-python = ">= 3.11"
dependencies = [
    "numpy >=2.3,<3",
    "scipy >=1.16,<2",
    "numba >=0.62",
]
keywords = [
    "quantum many-body",
    "bosonic Josephson junction",
    "Bose-Einstein condensate",
    "Lipkin-Meshkov-Glick",
    "Chebyshev propagator",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/serranolio/many-body-quantum-simulator"
Repository = "https://github.com/serranolio/many-body-quantum-simulator"
Issues = "https://github.com/serranolio/many-body-quantum-simulator/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >=1.27"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
many-body-quantum-simulator = { path = ".", editable = true }

# Core dependencies, installed from conda-forge
[tool.pixi.dependencies]
python = ">=3.11"
numpy = ">=2.3.4,<3"
scipy = ">=1.16.3,<2"
numba = ">=0.62.1,<0.63"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.4.2,<9"
pytest-cov = ">=7.0.0,<8"

[tool.pixi.feature.test.tasks]
test = "pytest tests"

# Analysis and notebooks
[tool.pixi.feature.dev.dependencies]
matplotlib = ">=3.10.8,<4"
ipython = ">=9.11.0,<10"
jupyter = ">=1.1.1,<2"
notebook = ">=7.4.7,<8"
pandas = ">=2.3.3,<3"
joblib = ">=1.5.2,<2"

[tool.pixi.environments]
default = ["test"]
dev = ["dev", "test"]
